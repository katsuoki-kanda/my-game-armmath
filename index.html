<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hand Pose Math Game - Fixed Audio</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: cover; }
        
        #ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; text-align: center; }
        
        .hud-left { position: absolute; top: env(safe-area-inset-top, 10px); left: env(safe-area-inset-left, 15px); font-size: 3.5vw; color: #0f0; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        .hud-right { position: absolute; top: env(safe-area-inset-top, 10px); right: env(safe-area-inset-right, 15px); font-size: 3.5vw; color: #fff; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        
        #question { position: absolute; top: 2%; width: 100%; font-size: 12vw; color: #ff0; text-shadow: 4px 4px 0px #f00, 0 0 10px rgba(0,0,0,0.8); font-weight: bold; line-height: 1; z-index: 10; }
        #msg { position: absolute; top: 75%; width: 100%; font-size: 5vw; color: #0ff; text-shadow: 2px 2px 4px #000; white-space: pre-wrap; }

        #audio-init { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; 
            z-index: 100; cursor: pointer; text-align: center;
        }
        #audio-init p { font-size: 24px; color: #fff; border: 2px solid #fff; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="audio-init">
        <p>画面をタップして開始<br>(音声を有効にします)</p>
    </div>

    <video id="input_video" style="display:none;" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="hud-left">Score: <span id="score">0</span></div>
        <div class="hud-right">Time: <span id="timer">60</span></div>
        <div id="question"></div>
        <div id="msg">カメラ読み込み中...</div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const questionEl = document.getElementById('question');
        const msgEl = document.getElementById('msg');
        const audioInit = document.getElementById('audio-init');

        let score = 0, timeLeft = 60, gameActive = false;
        let targets = [], currentAnswer = 0, isProcessingNext = false;
        let isCooldown = false;
        let isCameraReady = false; 
        let canTouch = true;
        let audioEnabled = false;
        let circleRadius = 45;

        // オーディオコンテキストをグローバルで定義（一つだけ作る）
        let audioCtx = null;

        audioInit.addEventListener('click', () => {
            audioEnabled = true;
            audioInit.style.display = 'none';

            // ここで一度だけAudioContextを作成
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // iOSなどのスリープ解除
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            speak(""); 
            playBeep(true); 
        });

        function updateCanvasSize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            circleRadius = Math.min(window.innerWidth, window.innerHeight) * 0.07;
        }
        window.addEventListener('resize', updateCanvasSize);
        updateCanvasSize();

        function speak(text) {
            if (!audioEnabled) return;
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            window.speechSynthesis.speak(uttr);
        }

        // 修正版：グローバルのaudioCtxを使い回す
        function playBeep(silent = false) {
            if (!audioEnabled || !audioCtx) return;

            // 呼び出し毎にコンテキストの状態を確認
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.value = 880;
            const duration = silent ? 0.01 : 0.15;
            const now = audioCtx.currentTime;

            osc.start(now);
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.stop(now + duration);
        }

        function generateTargets() {
            targets = [];
            const nums = Array.from({length: 10}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            
            const horizontalMargin = circleRadius + 30;
            const playableWidth = canvasElement.width - (horizontalMargin * 2);
            const partWidth = playableWidth / 10;
            
            const topMargin = canvasElement.height * 0.25; 
            const spawnRangeY = canvasElement.height * 0.40; 

            for (let i = 0; i < 10; i++) {
                targets.push({
                    x: horizontalMargin + (i * partWidth) + (partWidth / 2),
                    y: Math.random() * spawnRangeY + topMargin,
                    num: nums[i]
                });
            }
        }

        function nextRound() {
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 5) + 1;
            currentAnswer = a + b;
            questionEl.innerText = `${a} + ${b}`;
            generateTargets();
            isProcessingNext = false;
        }

        function startGame() {
            if (gameActive || isCooldown) return;
            score = 0; timeLeft = 60;
            scoreEl.innerText = score;
            gameActive = true;
            canTouch = true;
            msgEl.innerText = "";
            nextRound();
            speak("スタート");
            
            const timerInterval = setInterval(() => {
                if (!gameActive) { clearInterval(timerInterval); return; }
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            questionEl.innerText = "";
            msgEl.innerText = "終了！\nスコア: " + score;
            speak(`${score}点です。終了。`);
            isCooldown = true;
            setTimeout(() => {
                isCooldown = false;
                if (!gameActive) msgEl.innerText = "腕を高く上げてスタート";
            }, 3000);
        }

        function onResults(results) {
            if (!isCameraReady) {
                isCameraReady = true;
                msgEl.innerText = "腕を高く上げてスタート";
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const handIndices = [19, 20];
                let startSignal = false;
                let bothHandsLow = true;

                handIndices.forEach(idx => {
                    const hand = results.poseLandmarks[idx];
                    if (!hand) return;
                    
                    const hx = hand.x * canvasElement.width;
                    const hy = hand.y * canvasElement.height;

                    canvasCtx.strokeStyle = canTouch ? "yellow" : "rgba(255, 255, 255, 0.5)";
                    canvasCtx.lineWidth = 6;
                    canvasCtx.beginPath();
                    canvasCtx.arc(hx, hy, circleRadius, 0, Math.PI * 2);
                    canvasCtx.stroke();
                    
                    if (hand.y < 0.25 && !isCooldown) startSignal = true;

                    if (hand.y < 0.75) {
                        bothHandsLow = false;
                    }

                    if (gameActive && !isProcessingNext && canTouch) {
                        targets.forEach(t => {
                            if (t.num === currentAnswer) {
                                const dist = Math.sqrt((hx - t.x)**2 + (hy - t.y)**2);
                                if (dist < circleRadius + 20) {
                                    isProcessingNext = true;
                                    canTouch = false;
                                    score++;
                                    scoreEl.innerText = score;
                                    playBeep();
                                    setTimeout(nextRound, 500);
                                }
                            }
                        });
                    }
                });

                if (!canTouch && bothHandsLow) {
                    canTouch = true;
                }

                if (!gameActive && startSignal) startGame();

                if (gameActive) {
                    targets.forEach(t => {
                        canvasCtx.fillStyle = (t.num === currentAnswer && isProcessingNext) ? "#0f0" : "#f00";
                        canvasCtx.beginPath();
                        canvasCtx.arc(t.x, t.y, circleRadius, 0, Math.PI * 2);
                        canvasCtx.fill();

                        canvasCtx.save();
                        canvasCtx.translate(t.x, t.y);
                        canvasCtx.scale(-1, 1);
                        canvasCtx.fillStyle = "#fff";
                        canvasCtx.font = `bold ${circleRadius}px sans-serif`;
                        canvasCtx.textAlign = "center";
                        canvasCtx.textBaseline = "middle";
                        canvasCtx.fillText(t.num, 0, 0);
                        canvasCtx.restore();
                    });
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 1280, height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>
