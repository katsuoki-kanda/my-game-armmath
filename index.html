<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Pose Calculation Game - Fixed Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; text-align: center; }
        .hud-left { position: absolute; top: 15px; left: 25px; font-size: 36px; color: #0f0; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        .hud-right { position: absolute; top: 15px; right: 25px; font-size: 36px; color: #fff; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        #question { position: absolute; top: 5px; width: 100%; font-size: 90px; color: #ff0; text-shadow: 4px 4px 0px #f00, 0 0 10px rgba(0,0,0,0.8); font-weight: bold; line-height: 1; }
        #msg { position: absolute; top: 45%; width: 100%; font-size: 50px; color: #0ff; text-shadow: 2px 2px 4px #000; white-space: pre-wrap; }
        /* 次の判定待ち状態を視覚的に伝える（任意） */
        #status-dot { position: absolute; bottom: 20px; right: 20px; width: 20px; height: 20px; border-radius: 50%; background: #0f0; }
    </style>
</head>
<body>

    <video id="input_video" style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="hud-left">Score: <span id="score">0</span></div>
        <div class="hud-right">Time: <span id="timer">60</span></div>
        <div id="question"></div>
        <div id="msg">カメラ読み込み中...</div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const questionEl = document.getElementById('question');
        const msgEl = document.getElementById('msg');

        let score = 0, timeLeft = 60, gameActive = false;
        let targets = [], currentAnswer = 0, isProcessingNext = false;
        let isCooldown = false;
        let isCameraReady = false; 
        let canTouch = true; // 連投防止用のフラグ
        const circleRadius = 45;

        function updateCanvasSize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', updateCanvasSize);
        updateCanvasSize();

        function speak(text) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            window.speechSynthesis.speak(uttr);
        }

        function generateTargets() {
            targets = [];
            const nums = Array.from({length: 10}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            
            const horizontalMargin = circleRadius + 20;
            const playableWidth = canvasElement.width - (horizontalMargin * 2);
            const partWidth = playableWidth / 10;
            
　　　　　　//上側の隙間
            const topMargin = 170;
            const spawnRangeY = 200;

            for (let i = 0; i < 10; i++) {
                targets.push({
                    x: horizontalMargin + (i * partWidth) + (partWidth / 2),
                    y: Math.random() * spawnRangeY + topMargin,
                    num: nums[i]
                });
            }
        }

        function nextRound() {
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 5) + 1;
            currentAnswer = a + b;
            questionEl.innerText = `${a} + ${b}`;
            generateTargets();
            isProcessingNext = false;
        }

        function startGame() {
            if (gameActive || isCooldown) return;
            score = 0; timeLeft = 60;
            scoreEl.innerText = score;
            gameActive = true;
            canTouch = true;
            msgEl.innerText = "";
            nextRound();
            speak("スタート");
            
            const timerInterval = setInterval(() => {
                if (!gameActive) { clearInterval(timerInterval); return; }
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            questionEl.innerText = "";
            msgEl.innerText = "終了！\nスコア: " + score;
            speak(`${score}点です。終了。`);
            isCooldown = true;
            setTimeout(() => {
                isCooldown = false;
                if (!gameActive) msgEl.innerText = "腕を高く上げてスタート";
            }, 3000);
        }

        function onResults(results) {
            if (!isCameraReady) {
                isCameraReady = true;
                msgEl.innerText = "腕を高く上げてスタート";
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const handIndices = [19, 20];
                let startSignal = false;
                let bothHandsLow = true; // 両手が下がっているかチェック

                handIndices.forEach(idx => {
                    const hand = results.poseLandmarks[idx];
                    if (!hand) return;
                    
                    const hx = hand.x * canvasElement.width;
                    const hy = hand.y * canvasElement.height;

                    // 手の可視化
                    canvasCtx.strokeStyle = canTouch ? "yellow" : "rgba(255, 255, 255, 0.5)";
                    canvasCtx.lineWidth = 6;
                    canvasCtx.beginPath();
                    canvasCtx.arc(hx, hy, circleRadius, 0, Math.PI * 2);
                    canvasCtx.stroke();
                    
                    // スタート判定（上部35%より上）
                    if (hand.y < 0.35 && !isCooldown) startSignal = true;

                    // 手がターゲットエリア（約80%より上）にいる場合は「戻っていない」とみなす
                    if (hand.y < 0.8) {
                        bothHandsLow = false;
                    }

                    // タッチ判定
                    if (gameActive && !isProcessingNext && canTouch) {
                        targets.forEach(t => {
                            if (t.num === currentAnswer) {
                                const dist = Math.sqrt((hx - t.x)**2 + (hy - t.y)**2);
                                if (dist < circleRadius + 15) {
                                    isProcessingNext = true;
                                    canTouch = false; // 正解したら一旦タッチ不可にする
                                    score++;
                                    scoreEl.innerText = score;
                                    playBeep();
                                    setTimeout(nextRound, 500);
                                }
                            }
                        });
                    }
                });

                // 両手が画面の下側（85%以下）に戻ったら、再びタッチを有効にする
                if (!canTouch && bothHandsLow) {
                    canTouch = true;
                }

                if (!gameActive && startSignal) startGame();

                if (gameActive) {
                    targets.forEach(t => {
                        // 次の問題の準備中、またはタッチ不可状態の時は色を変えても良い
                        canvasCtx.fillStyle = (t.num === currentAnswer && isProcessingNext) ? "#0f0" : "#f00";
                        //if(!canTouch && t.num === currentAnswer) canvasCtx.globalAlpha = 0.5; // 次の正解を半透明にする

                        canvasCtx.beginPath();
                        canvasCtx.arc(t.x, t.y, circleRadius, 0, Math.PI * 2);
                        canvasCtx.fill();
                        canvasCtx.globalAlpha = 1.0;

                        canvasCtx.save();
                        canvasCtx.translate(t.x, t.y);
                        canvasCtx.scale(-1, 1);
                        canvasCtx.fillStyle = "#fff";
                        canvasCtx.font = "bold 45px sans-serif";
                        canvasCtx.textAlign = "center";
                        canvasCtx.textBaseline = "middle";
                        canvasCtx.fillText(t.num, 0, 0);
                        canvasCtx.restore();
                    });
                }
            }
            canvasCtx.restore();
        }

        function playBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.stop(audioCtx.currentTime + 0.15);
        }

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
